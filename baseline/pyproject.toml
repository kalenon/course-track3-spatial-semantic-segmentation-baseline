[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssp-course-track3-baseline"
version = "1.0.0"
description = "Spatial-semantic sound-scene segmentation baseline for SSP course Track 3"
readme = "README.md"
dependencies = [
  "einops==0.8.1",
  "huggingface-hub==0.29.3",
  "librosa==0.11.0",
  "lightning==2.5.1",
  "netCDF4==1.7.2",
  "nnAudio==0.3.3",
  "numpy>=1.26,<2.1",
  "pysofaconventions==0.1.5",
  "python-sofa==0.2.0",
  "pytorch-lightning==2.5.1",
  "pytz==2025.1",
  "PyYAML==6.0.2",
  "scipy>=1.13,<1.16",
  "soundfile==0.13.1",
  "tensorboard==2.19.0",
  "timm==1.0.15",
  "torchlibrosa==0.1.0",
  "torchmetrics==1.7.0",
  "tqdm==4.67.1",
  "transformers==4.50.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
